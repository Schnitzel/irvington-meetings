name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read

# A run in progress finishes rather than being cancelled, so a deploy is
# never left half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # A stable release. The pipeline scripts run on the owner's laptop,
          # not here — CI only ever builds the site.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx astro build

      # The audio lives on the Internet Archive. Cloudflare Pages also caps
      # individual files at 25 MiB, so a stray recording would fail the
      # upload rather than merely bloating it.
      - name: Check no audio slipped into the build
        run: |
          if find dist -name '*.m4a' -o -name '*.mp3' | grep -q .; then
            echo "::error::Audio files found in dist/. They belong on the Internet Archive."
            find dist -name '*.m4a' -o -name '*.mp3'
            exit 1
          fi
          echo "dist/ is $(du -sh dist | cut -f1)"

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=irvington-meetings --branch=main
